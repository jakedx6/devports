name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m devports list -d 2
      - name: Plugin manifest is valid JSON with the expected id
        run: python -c "import json; m = json.load(open('manifest.json')); assert m['id'] == 'jakedx6.devports', m['id']"
      - name: Shell scripts parse
        run: bash -n install.sh bin/devports-open
      - name: No symlinks (Omarchy's plugin validator rejects them)
        run: test -z "$(git ls-files -s | awk '$1 == "120000"')"
