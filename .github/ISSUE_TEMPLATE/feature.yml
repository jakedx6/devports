name: Feature request
description: Something devports should show or do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. "I run three Turborepo apps and can't tell them apart" beats "add a column".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
